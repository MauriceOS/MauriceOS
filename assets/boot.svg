    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="2.2s" fill="freeze"/>
  </text>
  <text x="88" y="114" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#3fb950">
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="2.6s" repeatCount="indefinite"/>
    ˆ
