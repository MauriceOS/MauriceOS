<svg xmlns="http://www.w3.org/2000/svg" width="520" height="132" viewBox="0 0 520 132" role="img" aria-label="Boot sequence">
  <rect width="520" height="132" rx="6" fill="#0d1117"/>
  <text x="16" y="26" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#8b949e">
    [BOOT] Sn0w8irD operator console
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0s" fill="freeze"/>
  </text>
  <text x="16" y="48" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#3fb950">
    [OK]   OSCP credential loaded
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.55s" fill="freeze"/>
  </text>
  <text x="16" y="70" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#3fb950">
    [OK]   ~/builds mounted (cpointed + tooling)
