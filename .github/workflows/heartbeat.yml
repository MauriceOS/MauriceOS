name: Operator Heartbeat

on:
  schedule:
    - cron: '0 0 * * 1'  # Monday 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update pulse.log
        run: |
          PULSE="$(date -u +'%Y-%m-%d %H:%M:%S')"
          {
            echo "[!] LAST_CHECKIN: ${PULSE} UTC"
            echo "[!] STATUS: profile heartbeat active"
          } > pulse.log

      - name: Commit Pulse
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Sentinel-Bot"
          git add pulse.log
          git diff --staged --quiet && exit 0
          git commit -m "SEC: Profile check-in [$(date -u +'%Y-%m-%d')]"
          git push
